jmvx.role="SingleLeaderWithoutCoordinator"
#Most settings are not needed...
vectorclock=HybridVectorClock
checksumCommunicationEnabled=false
readsFromDisk=false
avoidObjectSerialization=true
useBufferBackedStreams=true
computePartialOrders=true

validateWrites=false
fastExit=true

recordingDir=rec

divergenceHandlerClassName=edu.uic.cs.jmvx.runtime.DacapoDivergenceHandler
junkPort=9999

delayedWriteRecording=true
markElidedEvents=true

circularBufferCommunicationEnabled=true
mappedMemorySize=819200000
mappedMemoryLocation=/dev/shm/
deleteMmapOnDisk=true

consoleLogsEnabled=true
coreDumpAtEnd=false

sync=true
logNatives=false
